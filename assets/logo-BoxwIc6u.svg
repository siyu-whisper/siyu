<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- 方案 L1：折页耳语（中国风对撞色 #494266 黛紫 × #E9E8EF 云水灰白） -->
  <rect x="4" y="4" width="56" height="56" rx="15" fill="#E9E8EF" stroke="#494266" stroke-width="1.8"/>
  <!-- 左折页与右折页（构成的立体半掩报页） -->
  <path d="M16 20L32 16V45L16 49V20Z" fill="#DFDDE9" stroke="#494266" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M48 20L32 16V45L48 49V20Z" fill="#F4F3F8" stroke="#494266" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- 报页后方微微探出的双人私语圆点 -->
  <circle cx="27.5" cy="31.5" r="2.3" fill="#494266"/>
  <circle cx="36.5" cy="31.5" r="2.3" fill="#7B7399"/>
  <!-- 顶部一缕消散于风中的轻音弧线 -->
  <path d="M25 11.5C29.5 9.2 34.5 9.2 39 11.5" stroke="#6E668C" stroke-width="1.5" stroke-linecap="round"/>
</svg>
