<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="referrer" content="no-referrer" />
  <title>私语 · 安静的聊聊心事</title>
  <link rel="icon" type="image/svg+xml" href="/siyu/assets/logo-BoxwIc6u.svg" />
  <script type="module" crossorigin src="/siyu/assets/index-BX7_Q1DB.js"></script>
  <link rel="stylesheet" crossorigin href="/siyu/assets/index-DLvbWxHA.css">
</head>
<body>
  <!-- 柔和国风底纹层（#E9E8EF 云水缣素 × #494266 暮山黛紫 × 疏竹暗纹） -->
  <div class="ambient-backdrop" aria-hidden="true">
    <div class="ambient-mist"></div>
    <!-- 右上角水墨疏竹意境暗纹（呼应中国风对撞色卡右上角竹叶） -->
    <svg class="ambient-bamboo" viewBox="0 0 420 360" fill="none">
      <g opacity="0.13" fill="#494266">
        <path d="M420 0C360 42 308 98 258 168C295 122 352 72 420 26Z"/>
        <path d="M348 52C312 62 262 78 214 96C258 92 306 82 348 64Z"/>
        <path d="M332 82C302 112 272 152 246 196C280 162 310 124 338 92Z"/>
        <path d="M286 126C244 134 198 148 158 166C202 162 246 150 288 136Z"/>
        <path d="M386 96C358 134 334 178 316 226C344 188 368 144 392 106Z"/>
        <path d="M268 158C248 192 232 230 222 268C242 234 258 198 274 164Z"/>
        <path d="M362 32C330 28 286 30 242 38C284 42 326 42 362 40Z"/>
      </g>
    </svg>
  </div>

  <main class="app-shell">
    <!-- ==================== 1. 网站首页（极简三段式美术馆相框装裱构图） ==================== -->
    <section id="landing-view" class="view-panel landing-panel" aria-label="私语首页">
      <div class="landing-card">
        <!-- 顶部：L1 折页耳语图标 + 私语 + S3 Slogan -->
        <header class="brand-header">
          <div class="logo-halo">
            <img src="data:image/svg+xml,%3csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%20fill='none'%3e%3c!--%20方案%20L1：折页耳语（中国风对撞色%20%23494266%20黛紫%20×%20%23E9E8EF%20云水灰白）%20--%3e%3crect%20x='4'%20y='4'%20width='56'%20height='56'%20rx='15'%20fill='%23E9E8EF'%20stroke='%23494266'%20stroke-width='1.8'/%3e%3c!--%20左折页与右折页（构成的立体半掩报页）%20--%3e%3cpath%20d='M16%2020L32%2016V45L16%2049V20Z'%20fill='%23DFDDE9'%20stroke='%23494266'%20stroke-width='1.8'%20stroke-linejoin='round'/%3e%3cpath%20d='M48%2020L32%2016V45L48%2049V20Z'%20fill='%23F4F3F8'%20stroke='%23494266'%20stroke-width='1.8'%20stroke-linejoin='round'/%3e%3c!--%20报页后方微微探出的双人私语圆点%20--%3e%3ccircle%20cx='27.5'%20cy='31.5'%20r='2.3'%20fill='%23494266'/%3e%3ccircle%20cx='36.5'%20cy='31.5'%20r='2.3'%20fill='%237B7399'/%3e%3c!--%20顶部一缕消散于风中的轻音弧线%20--%3e%3cpath%20d='M25%2011.5C29.5%209.2%2034.5%209.2%2039%2011.5'%20stroke='%236E668C'%20stroke-width='1.5'%20stroke-linecap='round'/%3e%3c/svg%3e" alt="私语 Logo" class="brand-logo-lg" width="50" height="50" />
          </div>
          <h1 class="brand-title">私语</h1>
          <p class="brand-subtitle">有些话不必惊动世界，读完便融进风里。</p>
        </header>

        <!-- 中央：双层衬纸美术馆相框 + 图2旧报长椅私语画芯 -->
        <div class="gallery-frame">
          <div class="gallery-mat-border">
            <div class="gallery-artwork-wrap">
              <img src="/siyu/assets/hero-couple-Chg9B1Vs.jpg" alt="长椅旧报私语" class="gallery-artwork-img" />
            </div>
          </div>
          <div class="gallery-caption">
            <span>SIYU · EPHEMERAL WHISPER</span>
            <span>阅后即焚</span>
          </div>
        </div>

        <!-- 底部：暮山黛紫 × 云水灰白开启按钮 -->
        <div class="landing-actions">
          <button id="start-whisper-btn" type="button" class="primary-whisper-btn">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M12 3c4.97 0 9 3.58 9 8 0 2.38-1.17 4.52-3.03 5.98L19 21l-4.32-1.44C13.82 19.84 12.92 20 12 20c-4.97 0-9-3.58-9-8s4.03-8 9-8z" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M9 11.5h.01M12 11.5h.01M15 11.5h.01" stroke-width="2.4" stroke-linecap="round"/>
            </svg>
            <span>点击我，开始私语吧</span>
          </button>
        </div>
      </div>
    </section>

    <!-- ==================== 2. 聊天主界面（房间激活时展示） ==================== -->
    <section id="chat-view" class="view-panel chat-panel hidden" aria-label="私语对话窗口">
      <!-- 顶部固定栏：Logo + 房间状态指示 + 方案A国风代号印章 + 音视频快捷入口 + “结束并清除”按钮 -->
      <header class="chat-topbar">
        <div class="topbar-left">
          <img src="data:image/svg+xml,%3csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%20fill='none'%3e%3c!--%20方案%20L1：折页耳语（中国风对撞色%20%23494266%20黛紫%20×%20%23E9E8EF%20云水灰白）%20--%3e%3crect%20x='4'%20y='4'%20width='56'%20height='56'%20rx='15'%20fill='%23E9E8EF'%20stroke='%23494266'%20stroke-width='1.8'/%3e%3c!--%20左折页与右折页（构成的立体半掩报页）%20--%3e%3cpath%20d='M16%2020L32%2016V45L16%2049V20Z'%20fill='%23DFDDE9'%20stroke='%23494266'%20stroke-width='1.8'%20stroke-linejoin='round'/%3e%3cpath%20d='M48%2020L32%2016V45L48%2049V20Z'%20fill='%23F4F3F8'%20stroke='%23494266'%20stroke-width='1.8'%20stroke-linejoin='round'/%3e%3c!--%20报页后方微微探出的双人私语圆点%20--%3e%3ccircle%20cx='27.5'%20cy='31.5'%20r='2.3'%20fill='%23494266'/%3e%3ccircle%20cx='36.5'%20cy='31.5'%20r='2.3'%20fill='%237B7399'/%3e%3c!--%20顶部一缕消散于风中的轻音弧线%20--%3e%3cpath%20d='M25%2011.5C29.5%209.2%2034.5%209.2%2039%2011.5'%20stroke='%236E668C'%20stroke-width='1.5'%20stroke-linecap='round'/%3e%3c/svg%3e" alt="私语" class="brand-logo-sm" width="32" height="32" />
          <span class="topbar-brand">私语</span>
          <span class="topbar-divider" aria-hidden="true"></span>
          <div id="connection-badge" class="status-badge status-waiting" role="status" aria-live="polite">
            <span class="status-dot"></span>
            <span id="connection-status-text">等待对方加入 (1/2)</span>
          </div>

          <!-- 方案A：当前用户国风临时雅称胶囊（点击可随时改代号） -->
          <div class="alias-pill-wrap">
            <button id="self-alias-btn" type="button" class="self-alias-btn" title="点击修改你在本房间的临时代号">
              <span class="alias-dot" id="self-alias-dot"></span>
              <span id="self-alias-text">听风</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
                <path d="M12 20h9" stroke-linecap="round"/>
                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div id="alias-edit-box" class="alias-edit-box hidden">
              <input id="alias-edit-input" type="text" class="alias-edit-input" maxlength="8" placeholder="输入代号" aria-label="输入临时代号" />
              <button id="alias-save-btn" type="button" class="alias-save-btn">确定</button>
            </div>
          </div>
        </div>

        <div class="topbar-right">
          <button id="toggle-invite-btn" type="button" class="ghost-icon-btn" title="展开或收起密函邀请凭据">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="hide-xs">密函链接</span>
          </button>

          <button id="end-and-clear-btn" type="button" class="danger-burn-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
              <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14" stroke-linecap="round" stroke-linejoin="round"/>
              <line x1="10" y1="11" x2="10" y2="17" stroke-linecap="round"/>
              <line x1="14" y1="11" x2="14" y2="17" stroke-linecap="round"/>
            </svg>
            <span>结束并清除</span>
          </button>
        </div>
      </header>

      <!-- 房间邀请链接面板（精致胶囊式密函凭据条 + 默认2人/最大5人上限设置） -->
      <div id="invite-bar" class="invite-bar">
        <div class="invite-info">
          <div class="invite-url-row">
            <div class="invite-input-capsule">
              <span class="invite-tag-badge">密函</span>
              <input id="invite-link-input" type="text" class="invite-url-input" readonly aria-label="房间邀请链接" />
            </div>
            <button id="copy-link-btn" type="button" class="copy-link-btn">复制链接</button>
            <label class="max-peers-control" for="max-peers-select" title="设置房间最大允许进入人数（默认2人，最高5人）">
              <span class="max-peers-label">上限</span>
              <select id="max-peers-select" class="max-peers-select" aria-label="房间最大人数上限">
                <option value="2" selected>2人 (默认)</option>
                <option value="3">3人</option>
                <option value="4">4人</option>
                <option value="5">5人 (最大)</option>
              </select>
            </label>
          </div>
          <span id="invite-format-hint" class="invite-format-hint"></span>
        </div>
      </div>

      <!-- 实时语音/视频通话来电邀请横幅 -->
      <div id="call-invite-banner" class="call-invite-banner hidden" role="alert">
        <div class="call-invite-info">
          <span class="call-ring-dot"></span>
          <span id="call-invite-text" class="call-invite-text">对方邀请你进行实时语音通话...</span>
        </div>
        <div class="call-invite-actions">
          <button id="accept-call-btn" type="button" class="call-accept-btn">接听</button>
          <button id="decline-call-btn" type="button" class="call-decline-btn">婉拒</button>
        </div>
      </div>

      <!-- 实时语音与高清视频对话主舞台（支持纯语音声波对话、1080P/720P高清双人视频画中画、静音、开关摄像头、全屏与挂断） -->
      <div id="live-call-stage" class="live-call-stage hidden">
        <div class="live-call-header">
          <div class="live-call-title-group">
            <span class="live-call-dot"></span>
            <span id="live-call-status-text" class="live-call-title">实时语音通话中</span>
            <span id="live-call-timer" class="live-call-timer">00:00</span>
            <span id="live-call-hd-badge" class="live-call-hd-badge hidden">HD 1080P 增强</span>
          </div>
          <div class="live-call-controls">
            <button id="call-toggle-mic-btn" type="button" class="cinema-ctrl-btn" title="静音或取消静音麦克风">
              🎙️ 麦克风: 开
            </button>
            <button id="call-toggle-cam-btn" type="button" class="cinema-ctrl-btn" title="开启或关闭高清摄像头视频画面">
              📷 摄像头: 关
            </button>
            <button id="call-toggle-hd-btn" type="button" class="cinema-ctrl-btn is-active hidden" title="开启或关闭实时视频高清锐化与画质增强引擎">
              ✨ 超清增强: 开
            </button>
            <button id="call-fullscreen-btn" type="button" class="cinema-ctrl-btn" title="全屏切换">
              ⛶ 全屏
            </button>
            <button id="hangup-call-btn" type="button" class="cinema-stop-btn" title="挂断并结束本次通话">
              📴 挂断
            </button>
          </div>
        </div>

        <div id="live-call-body" class="live-call-body">
          <!-- 纯语音通话声波视图 -->
          <div id="call-audio-avatar-view" class="call-audio-avatar-view">
            <div class="call-participant-card">
              <span id="call-self-seal" class="call-avatar-circle">听</span>
              <span id="call-self-name" class="call-avatar-name">听风 · 我</span>
            </div>
            <div class="call-soundwave-bridge" aria-hidden="true">
              <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
            <div class="call-participant-card">
              <span id="call-peer-seal" class="call-avatar-circle is-peer">枕</span>
              <span id="call-peer-name" class="call-avatar-name">对方</span>
            </div>
          </div>

          <!-- 高清视频通话画中画视图（内置 SVG 卷积锐化滤镜 #siyu-hd-sharpen） -->
          <div id="call-video-grid-view" class="call-video-grid-view hidden">
            <svg width="0" height="0" style="position:absolute;pointer-events:none" aria-hidden="true">
              <defs>
                <filter id="siyu-hd-sharpen" color-interpolation-filters="sRGB">
                  <feConvolveMatrix
                    order="3 3"
                    preserveAlpha="true"
                    kernelMatrix="0 -0.35 0 -0.35 2.4 -0.35 0 -0.35 0"
                  />
                  <feComponentTransfer>
                    <feFuncR type="linear" slope="1.04" intercept="-0.015"/>
                    <feFuncG type="linear" slope="1.04" intercept="-0.015"/>
                    <feFuncB type="linear" slope="1.04" intercept="-0.015"/>
                  </feComponentTransfer>
                </filter>
              </defs>
            </svg>
            <video id="call-remote-video" class="call-remote-video hd-video-enhanced" autoplay playsinline></video>
            <img id="call-remote-fallback-img" class="call-remote-video hd-video-enhanced hidden" alt="对方高清视频画面" />
            <div class="call-local-pip-wrap">
              <video id="call-local-video" class="call-local-video hd-video-enhanced" autoplay playsinline muted></video>
              <span class="call-pip-tag">我 · HD</span>
            </div>
          </div>

          <!-- 隐藏的远端音频播放器（确保纯语音模式下远端人声清晰播放） -->
          <audio id="call-remote-audio" autoplay class="hidden"></audio>
        </div>
      </div>

      <!-- 极简消息列表区域（区分自己/对方，支持文字、图片、语音、音视频连麦、撤回、文字编辑与已读回执） -->
      <div id="message-list" class="message-list" role="log" aria-live="polite">
        <div id="empty-chat-hint" class="empty-chat-hint">
          <div class="empty-ornament" aria-hidden="true">❖</div>
          <p class="empty-main-text">方寸私语，仅驻此刻内存</p>
          <p class="empty-sub">支持文字、图片、语音短讯、高清视频短片与实时音视频通话 · 任一人结束即全员焚毁</p>
        </div>
      </div>

      <!-- 底部悬浮坞式输入区（仅保留：语音短讯、图片、高清视频文件、实时语音通话、高清视频连麦、文字输入） -->
      <footer class="chat-composer">
        <!-- 常规输入栏 -->
        <div id="composer-normal-row" class="composer-row">
          <div class="composer-tools-dock">
            <!-- 语音短讯录制按钮 -->
            <button id="voice-record-btn" type="button" class="tool-btn" title="录制语音短讯" aria-label="录制语音">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="9" y="2" width="6" height="12" rx="3"/>
                <path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4M8 22h8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>

            <!-- 图片选择按钮 -->
            <button id="image-pick-btn" type="button" class="tool-btn" title="发送图片（支持粘贴或拖拽）" aria-label="发送图片">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="3" y="3" width="18" height="18" rx="3"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <path d="M21 15l-5-5L5 21" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <input id="image-file-input" type="file" accept="image/*" class="hidden" />

            <!-- 发送高清视频短片文件按钮 -->
            <button id="video-pick-btn" type="button" class="tool-btn" title="发送高清视频短片文件" aria-label="发送视频">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="2" y="4" width="20" height="16" rx="3"/>
                <polygon points="10,8.5 16,12 10,15.5" fill="currentColor" stroke="none"/>
              </svg>
            </button>
            <input id="video-file-input" type="file" accept="video/*" class="hidden" />

            <!-- 实时语音通话按钮 -->
            <button id="voice-call-btn" type="button" class="tool-btn" title="发起实时语音通话" aria-label="实时语音通话">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>

            <!-- 实时高清视频连麦按钮 -->
            <button id="video-call-btn" type="button" class="tool-btn" title="发起 1080P/720P 实时高清视频连麦" aria-label="实时视频连麦">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="2" y="5" width="14" height="14" rx="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <polygon points="22 7 16 12 22 17 22 7" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>

          <!-- 文字输入框 -->
          <input
            id="message-input"
            type="text"
            class="message-input"
            placeholder="写下一句私语，回车发送（支持直接粘贴图片）..."
            autocomplete="off"
            spellcheck="false"
            maxlength="4000"
          />

          <!-- 发送按钮 -->
          <button id="send-msg-btn" type="button" class="send-msg-btn">
            <span>发送</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
              <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>

        <!-- 语音录制进行中状态栏（盒子IM风格声波计时条） -->
        <div id="composer-recording-row" class="composer-recording-row hidden">
          <div class="recording-indicator">
            <span class="recording-red-dot"></span>
            <span id="recording-timer" class="recording-timer">00:00</span>
            <div class="recording-wave" aria-hidden="true">
              <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
            <span id="recording-mode-label" class="recording-mode-label">正在拾音...</span>
          </div>
          <div class="recording-actions">
            <button id="cancel-voice-btn" type="button" class="record-cancel-btn">取消</button>
            <button id="finish-voice-btn" type="button" class="record-send-btn">发送语音</button>
          </div>
        </div>
      </footer>
    </section>

    <!-- ==================== 3. 结束并清除后的终态视图（与首页对称的极简三段式画框构图） ==================== -->
    <section id="terminated-view" class="view-panel landing-panel terminated-panel hidden" aria-label="对话已结束终态">
      <div class="landing-card">
        <header class="brand-header">
