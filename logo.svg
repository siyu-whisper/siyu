<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="inkGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#3a3a3a"/>
    </linearGradient>
    <linearGradient id="mistGrad" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f7f7f7"/>
      <stop offset="100%" stop-color="#e3e3e3"/>
    </linearGradient>
  </defs>
  <!-- 极简雾白底印章 -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#mistGrad)" stroke="#2b2b2b" stroke-width="1.6"/>
  <!-- 顶部耳语声波暗纹 -->
  <path d="M23 13.5C28.5 10.5 35.5 10.5 41 13.5" stroke="#7a7a7a" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="1.5 2.5"/>
  <!-- 秋千横梁与支架 -->
  <line x1="17" y1="18" x2="47" y2="18" stroke="url(#inkGrad)" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="20" y1="18" x2="15.5" y2="49" stroke="url(#inkGrad)" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="44" y1="18" x2="48.5" y2="49" stroke="url(#inkGrad)" stroke-width="1.6" stroke-linecap="round"/>
  <!-- 秋千吊绳与座板 -->
  <line x1="24" y1="18" x2="24" y2="39" stroke="#333333" stroke-width="1.2"/>
  <line x1="40" y1="18" x2="40" y2="39" stroke="#333333" stroke-width="1.2"/>
  <line x1="22" y1="39.5" x2="42" y2="39.5" stroke="#181818" stroke-width="2.2" stroke-linecap="round"/>
  <!-- 并肩私语双人剪影（左深墨、右浅灰，微微相倾） -->
  <circle cx="28.8" cy="28" r="2.7" fill="#1f1f1f"/>
  <path d="M24.8 38.8C24.8 33.8 26.6 31.3 29.3 31.3C31.5 31.3 32.3 33.4 32.3 38.8Z" fill="#232323"/>
  <circle cx="35.3" cy="28.4" r="2.6" fill="#6f6f6f"/>
  <path d="M32.1 38.8C32.1 34 33.4 31.6 35.6 31.6C37.9 31.6 39.2 34 39.2 38.8Z" fill="#686868"/>
  <!-- 悬垂双腿剪影 -->
  <line x1="34.5" y1="40.2" x2="34.3" y2="45.5" stroke="#222222" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="36.8" y1="40.2" x2="37.0" y2="45.5" stroke="#222222" stroke-width="1.4" stroke-linecap="round"/>
  <!-- 雪地极简微波 -->
  <path d="M12 50.5Q32 48.5 52 50.5" stroke="#9e9e9e" stroke-width="1.1" stroke-linecap="round"/>
</svg>
