    </filter>
    <linearGradient id="darkCoat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#353535"/>
      <stop offset="50%" stop-color="#222222"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="lightCoat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9a9a9a"/>
      <stop offset="55%" stop-color="#7c7c7c"/>
      <stop offset="100%" stop-color="#5e5e5e"/>
    </linearGradient>
    <linearGradient id="blondeHair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e2e2"/>
      <stop offset="60%" stop-color="#c8c8c8"/>
      <stop offset="100%" stop-color="#9e9e9e"/>
    </linearGradient>
