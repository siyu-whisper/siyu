<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyMist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efefef"/>
      <stop offset="52%" stop-color="#e8e8e8"/>
      <stop offset="72%" stop-color="#dedede"/>
      <stop offset="100%" stop-color="#cccccc"/>
    </linearGradient>
    <radialGradient id="leftSlope" cx="0.06" cy="0.52" r="0.48">
      <stop offset="0%" stop-color="#cfcfcf" stop-opacity="0.65"/>
      <stop offset="65%" stop-color="#dcdcdc" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e8e8e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightSlope" cx="0.95" cy="0.54" r="0.45">
      <stop offset="0%" stop-color="#cccccc" stop-opacity="0.68"/>
      <stop offset="60%" stop-color="#dadada" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e8e8e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="snowGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e2e2" stop-opacity="0.1"/>
      <stop offset="22%" stop-color="#dcdcdc" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#d0d0d0" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#bcbcbc" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.48" r="0.68">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
    </radialGradient>
    <filter id="softBlur" x="-10%" y="-10%" width="120%" height="120%">
